{% extends "base.html" %}
{% block title %}About | ALDEA{% endblock %}

{% block content %}
<section class="about-shell glass-panel">
    <header class="about-hero">
        <div class="about-logo-ring" aria-hidden="true">
            <img src="{{ about_logo_url }}" alt="ALDEA logo" class="about-logo-image">
        </div>
        <h2>Meet ALDEA</h2>
        <p class="about-sub">A personal introduction generated from the current system prompt.</p>
    </header>

    <article class="about-intro-card">
        <div id="aboutIntroSummary">{{ about_intro_html | safe }}</div>
    </article>
</section>
{% endblock %}
