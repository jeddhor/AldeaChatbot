<!DOCTYPE html>
<html lang="en" data-theme="{{ settings.ui.theme_mode | default('matrix-green') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ALDEA{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="ambient-layer"></div>
    <header class="top-nav">
        <div class="brand-wrap">
            <div class="brand-icon" aria-hidden="true">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="" class="brand-logo-image">
            </div>
            <div>
                <h1 class="brand-title">ALDEA</h1>
                <p class="brand-subtitle">Adaptive Learning Digital Empathy Assistant</p>
            </div>
        </div>
        <nav class="nav-actions">
            <a href="{{ url_for('index') }}" class="nav-link">Chat</a>
            <a href="{{ url_for('settings_page') }}" class="nav-link">Configuration</a>
            <a href="{{ url_for('about_page') }}" class="nav-link">About</a>
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/highlight.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
